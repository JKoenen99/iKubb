<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="iKubb — the number kubb scoreboard. Score faster than pen and paper, learn the rules, keep player stats.">
  <meta name="theme-color" content="#2F4A3C">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="iKubb">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>iKubb</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #F5EFE6; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      background: #F5EFE6; z-index: 1;
      transition: opacity 250ms ease-out;
    }
    #splash .wordmark {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 34px; font-weight: 800; color: #2F4A3C;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <!-- Birch splash with the Viking mark, removed on Flutter's first frame. -->
  <div id="splash">
    <svg width="120" height="120" viewBox="0 0 100 100" aria-hidden="true">
      <path d="M34 34 Q26 30 27 20 Q33 26 37 30 Z" fill="#E8DCC8"/>
      <path d="M66 34 Q74 30 73 20 Q67 26 63 30 Z" fill="#E8DCC8"/>
      <circle cx="50" cy="46" r="20" fill="#F0C9A5"/>
      <path d="M30 48 A20 20 0 0 0 70 48 L70 52 A20 14 0 0 1 30 52 Z" fill="#B98A4E"/>
      <path d="M30 40 A20 20 0 0 1 70 40 L70 44 L30 44 Z" fill="#1E332A"/>
      <circle cx="43" cy="47" r="2.6" fill="#22201B"/>
      <circle cx="57" cy="47" r="2.6" fill="#22201B"/>
      <path d="M43 56 Q50 61 57 56" stroke="#22201B" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    </svg>
    <div class="wordmark">iKubb</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.style.opacity = '0';
      setTimeout(function () { splash.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
