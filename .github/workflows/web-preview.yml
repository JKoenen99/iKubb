# Builds the Flutter web preview and deploys it to GitHub Pages so the app
# can be tested on any device (iPad Safari included) without a native build.
# Web is a dev-preview target only — releases ship native iOS/Android.
#
# Supply-chain hygiene: every action is pinned to a full commit SHA (the
# tag it corresponds to is in the comment); Dependabot keeps them current.
name: Web preview

on:
  push:
  workflow_dispatch:

# Least privilege: the job only needs to read the repo and publish Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; the latest push wins.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      # The engine is its own package (own analysis_options), so analyze
      # needs its package config resolved first.
      - name: Engine dependencies
        working-directory: packages/scoring_engine
        run: dart pub get
      - run: flutter gen-l10n

      # Formatting and lints gate the deploy, like the tests below.
      - run: dart format --output=none --set-exit-if-changed lib test packages
      - run: flutter analyze

      - name: Engine tests
        working-directory: packages/scoring_engine
        run: dart test

      - name: Widget tests
        run: flutter test

      - run: flutter build web --release --base-href /iKubb/

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/web

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
