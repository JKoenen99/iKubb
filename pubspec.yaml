name: kaato
description: "Kaato - the number kubb scoreboard. Scandinavian modern, Viking soul."
publish_to: 'none'
version: 0.5.0+5

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  go_router: ^18.1.0
  http: ^1.6.0
  in_app_review: ^2.0.12
  intl: any
  live_activities: ^2.6.0
  package_info_plus: ^10.2.2
  rive: ^0.14.11
  scoring_engine:
    path: packages/scoring_engine
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  wakelock_plus: ^1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/character/
  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2.ttf
